services:
    tempo:
        image: ${TEMPO_IMAGE:-grafana/tempo:2.10.10}
        container_name: test-xmis-tempo
        restart: unless-stopped
        command: ["-config.file=/etc/tempo/config.yaml"]
        environment:
            GOMEMLIMIT: 192MiB
            GOMAXPROCS: "1"
        deploy:
            resources:
                limits:
                    cpus: "0.5"
                    memory: 256M
        volumes:
            - ./docker/tempo/config.yaml:/etc/tempo/config.yaml:ro
            - tempo_data:/var/tempo
        labels:
            - "traefik.enable=false"
        logging:
            options:
                max-file: "2"
                max-size: 5m
        networks:
            - default

    loki:
        image: ${LOKI_IMAGE:-grafana/loki:3.7.9}
        container_name: test-xmis-loki
        restart: unless-stopped
        command: ["-config.file=/etc/loki/config.yaml"]
        environment:
            GOMEMLIMIT: 192MiB
            GOMAXPROCS: "1"
        deploy:
            resources:
                limits:
                    cpus: "0.5"
                    memory: 256M
        volumes:
            - ./docker/loki/config.yaml:/etc/loki/config.yaml:ro
            - loki_data:/loki
        labels:
            - "traefik.enable=false"
        logging:
            options:
                max-file: "2"
                max-size: 5m
        networks:
            - default

    prometheus:
        image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.15.1}
        container_name: test-xmis-prometheus
        restart: always
        command:
            - --config.file=/etc/prometheus/prometheus.yml
            - --web.enable-remote-write-receiver
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=7d
            - --storage.tsdb.retention.size=1GB
            - --query.max-concurrency=2
            - --query.max-samples=1000000
            - --query.timeout=30s
        deploy:
            resources:
                limits:
                    cpus: "0.5"
                    memory: 256M
        volumes:
            - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
            - ./docs/specs/login-observability.prometheus.rules.yml:/etc/prometheus/rules/login-observability.yml:ro
            - prometheus_data:/prometheus
        healthcheck:
            test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/ready"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 30s
        logging:
            options:
                max-file: "2"
                max-size: 5m
        networks:
            - default

    grafana:
        image: ${GRAFANA_IMAGE:-grafana/grafana:13.2.4}
        container_name: test-xmis-grafana
        restart: always
        labels:
            - "traefik.enable=true"
            - "traefik.docker.network=sptr_all"
            - "traefik.http.routers.sptr-grafana.rule=Host(`${GRAFANA_DOMAIN:-grafana.test}`)"
            - "traefik.http.routers.sptr-grafana.entrypoints=web"
            - "traefik.http.routers.sptr-grafana.priority=100"
            - "traefik.http.routers.sptr-grafana.service=sptr-grafana"
            - "traefik.http.services.sptr-grafana.loadbalancer.server.port=3000"
        environment:
            GF_SERVER_ROOT_URL: http://${GRAFANA_DOMAIN:-grafana.test}/
            GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
            GF_SECURITY_COOKIE_SECURE: "false"
            GF_ANALYTICS_REPORTING_ENABLED: "false"
            GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
            GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
            GF_USERS_ALLOW_SIGN_UP: "false"
            GF_AUTH_ANONYMOUS_ENABLED: "false"
            GF_UNIFIED_ALERTING_ENABLED: "false"
            GF_LOG_LEVEL: warn
            GOMEMLIMIT: 192MiB
            GOMAXPROCS: "1"
        deploy:
            resources:
                limits:
                    cpus: "0.5"
                    memory: 256M
        volumes:
            - grafana_data:/var/lib/grafana
            - ./docker/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
            - ./docker/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
            - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
        depends_on:
            prometheus:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 60s
        logging:
            options:
                max-file: "2"
                max-size: 5m
        networks:
            - default
            - all

volumes:
    prometheus_data:
    grafana_data:
    tempo_data:
    loki_data:

networks:
    all:
        name: sptr_all
        external: true
