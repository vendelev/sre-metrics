global:
  scrape_interval: 60s
  scrape_timeout: 10s
  evaluation_interval: 60s

rule_files:
  - /etc/prometheus/rules/login-observability.yml

scrape_configs:
  - job_name: prometheus
    sample_limit: 5000
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: traefik
    sample_limit: 10000
    static_configs:
      - targets: ["traefik:9090"]

  - job_name: otel-collector
    honor_labels: true
    sample_limit: 10000
    static_configs:
      - targets: ["otel-collector:8889"]
