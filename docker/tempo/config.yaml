# Single-binary dev instance with local TraceQL metrics for Traces Drilldown.
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  max_block_bytes: 16777216
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 24h
    compaction_window: 1h

metrics_generator:
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        queue_config:
          min_shards: 1
          max_shards: 1
          capacity: 1000
          max_samples_per_send: 250
  traces_storage:
    path: /var/tempo/generator/traces
  processor:
    service_graphs:
      workers: 1
      max_items: 1000
    local_blocks:
      filter_server_spans: false
      flush_to_storage: true
      max_block_bytes: 16777216
      max_live_traces_bytes: 16777216
      concurrency: 1
      concurrent_blocks: 1
      block:
        parquet_row_group_size_bytes: 16777216

overrides:
  defaults:
    metrics_generator:
      processors: [local-blocks, service-graphs]

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

querier:
  max_concurrent_queries: 1

query_frontend:
  max_batch_size: 1
  search:
    concurrent_jobs: 1
  metrics:
    concurrent_jobs: 1

usage_report:
  reporting_enabled: false
