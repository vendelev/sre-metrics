receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
    spike_limit_mib: 32

  batch:
    timeout: 1s
    send_batch_size: 256
    send_batch_max_size: 512

  resource/common:
    attributes:
      - key: deployment.environment.name
        value: development
        action: insert
      - key: service.namespace
        value: sptr
        action: insert

  # Копируем только контрактные разрезы сервиса; исходный Resource сохраняется.
  transform/login_labels:
    error_mode: propagate
    metric_statements:
      - context: datapoint
        statements:
          - >-
            set(attributes["node"], resource.attributes["host.name"])
            where resource.attributes["service.name"] == "mis-login-observability"
            and resource.attributes["host.name"] != nil
          - >-
            set(attributes["environment"], resource.attributes["deployment.environment.name"])
            where resource.attributes["service.name"] == "mis-login-observability"
            and resource.attributes["deployment.environment.name"] != nil

connectors:
  spanmetrics:
    # Только префикс метрик спанов, не подключение к SigNoz.
    namespace: signoz
    histogram:
      explicit:
        buckets: [5ms, 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2s, 5s, 10s]

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    translation_strategy: UnderscoreEscapingWithSuffixes

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource/common, batch]
      # Хранилище трейсов подключается дополнительным конфигом окружения.
      exporters: [spanmetrics]
    metrics:
      receivers: [otlp, spanmetrics]
      processors: [memory_limiter, resource/common, transform/login_labels, batch]
      exporters: [prometheus]
