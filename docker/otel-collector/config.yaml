receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
    spike_limit_mib: 32

  batch:
    timeout: 1s
    send_batch_size: 256
    send_batch_max_size: 512

  resource/common:
    attributes:
      - key: deployment.environment
        value: development
        action: upsert
      - key: service.namespace
        value: sptr
        action: upsert

connectors:
  spanmetrics:
    # Metric name prefix only; no dependency on a SigNoz backend.
    namespace: signoz
    histogram:
      explicit:
        buckets: [5ms, 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2s, 5s, 10s]

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource/common, batch]
      # Trace storage is connected by an additional environment-specific config.
      exporters: [spanmetrics]
    metrics:
      receivers: [otlp, spanmetrics]
      processors: [memory_limiter, resource/common, batch]
      exporters: [prometheus]
