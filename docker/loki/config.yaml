# Single-binary dev instance. Only accessible inside the compose network.
auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

ingester:
  chunk_target_size: 262144
  chunk_idle_period: 5m
  max_chunk_age: 1h
  wal:
    replay_memory_ceiling: 32MB

querier:
  max_concurrent: 1

limits_config:
  retention_period: 24h
  ingestion_rate_mb: 1
  ingestion_burst_size_mb: 2
  max_query_parallelism: 1
  tsdb_max_query_parallelism: 1
  max_query_series: 100
  allow_structured_metadata: true

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
  retention_delete_worker_count: 1

analytics:
  reporting_enabled: false
