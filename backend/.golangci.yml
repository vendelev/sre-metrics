version: "2"

run:
    relative-path-mode: gomod

linters:
    default: standard
    enable:
        - depguard
        - errcheck
        - govet
        - ineffassign
        - staticcheck
        - unused
        - goconst
        - unconvert
        - gocritic
        - gocyclo
        - nakedret
        - gochecknoinits
        - sloglint
        - errorlint
        - nilerr
        - bodyclose
    exclusions:
        rules:
            -   path: '_test\.go$'
                linters:
                    - goconst
                    - gocyclo
    settings:
        staticcheck:
            checks:
                - all
        govet:
            enable:
                - appends
                - asmdecl
                - assign
                - atomic
                - bools
                - buildtag
                - cgocall
                - composites
                - copylocks
                - defers
                - directive
                - errorsas
                - framepointer
                - hostport
                - httpresponse
                - ifaceassert
                - inline
                - lostcancel
                - nilfunc
                - printf
                - shift
                - sigchanyzer
                - slog
                - stdmethods
                - stdversion
                - stringintconv
                - structtag
                - testinggoroutine
                - tests
                - timeformat
                - unmarshal
                - unreachable
                - unsafeptr
                - unusedresult
                - waitgroup
                - shadow
                - nilness
                - unusedwrite
        gocritic:
            enabled-checks:
                - hugeParam
        depguard:
            rules:
                fileinbox-api:
                    files:
                        - "${base-path}/pkg/fileinbox/api/*.go"
                        - "${base-path}/pkg/fileinbox/api/**/*.go"
                    list-mode: strict
                    allow:
                        - "$gostd"
                        - "go.opentelemetry.io/otel/metric$"
                fileinbox-config:
                    files:
                        - "${base-path}/pkg/fileinbox/config/*.go"
                        - "${base-path}/pkg/fileinbox/config/**/*.go"
                    list-mode: strict
                    allow:
                        - "$gostd"
                fileinbox-domain:
                    files:
                        - "${base-path}/pkg/fileinbox/internal/domain/*.go"
                        - "${base-path}/pkg/fileinbox/internal/domain/**/*.go"
                    list-mode: strict
                    allow:
                        - "$gostd"
                        - "github.com/google/uuid$"
                        - "github.com/vendelev/sre-metrics/pkg/fileinbox/internal/domain/"
                fileinbox-application:
                    files:
                        - "${base-path}/pkg/fileinbox/internal/application/*.go"
                        - "${base-path}/pkg/fileinbox/internal/application/**/*.go"
                        - "!${base-path}/pkg/fileinbox/internal/application/*_test.go"
                        - "!${base-path}/pkg/fileinbox/internal/application/**/*_test.go"
                    list-mode: strict
                    allow:
                        - "$gostd"
                        - "github.com/vendelev/sre-metrics/pkg/clock$"
                        - "github.com/vendelev/sre-metrics/pkg/fileinbox/api$"
                        - "github.com/vendelev/sre-metrics/pkg/fileinbox/internal/domain/"
                        - "github.com/vendelev/sre-metrics/pkg/fileinbox/internal/application/"
                fileinbox-presentation:
                    files:
                        - "${base-path}/pkg/fileinbox/internal/presentation/*.go"
                        - "${base-path}/pkg/fileinbox/internal/presentation/**/*.go"
                        - "!${base-path}/pkg/fileinbox/internal/presentation/*_test.go"
                        - "!${base-path}/pkg/fileinbox/internal/presentation/**/*_test.go"
                    list-mode: strict
                    allow:
                        - "$gostd"
                        - "github.com/fsnotify/fsnotify$"
                        - "go.opentelemetry.io/otel/metric$"
                        - "github.com/vendelev/sre-metrics/pkg/fileinbox/internal/application/"
                        - "github.com/vendelev/sre-metrics/pkg/fileinbox/internal/domain/"
                        - "github.com/vendelev/sre-metrics/pkg/fileinbox/internal/infrastructure/"
                        - "github.com/vendelev/sre-metrics/pkg/fileinbox/internal/presentation/"
                app-isolation:
                    files:
                        - "${base-path}/cmd/*.go"
                        - "${base-path}/cmd/**/*.go"
                    deny:
                        - pkg: "github.com/vendelev/sre-metrics/"
                          desc: "bootstrap приложения соединяет user-login и общие пакеты pkg через публичные API."
                    allow:
                        - "$gostd"
                        - "github.com/vendelev/sre-metrics/cmd/user-login-httpserver$"
                        - "github.com/vendelev/sre-metrics/cmd/user-login-httpserver/"
                        - "github.com/vendelev/sre-metrics/user-login/bootstrap$"
                        - "github.com/vendelev/sre-metrics/user-login/config$"
                        - "github.com/vendelev/sre-metrics/pkg/"
                    list-mode: lax
                user-login-bootstrap-isolation:
                    files:
                        - "${base-path}/user-login/bootstrap/*.go"
                        - "${base-path}/user-login/bootstrap/**/*.go"
                    deny:
                        - pkg: "github.com/vendelev/sre-metrics/"
                          desc: "bootstrap модуля не зависит от cmd: приложение соединяет компоненты через публичные API."
                    allow:
                        - "$gostd"
                        - "github.com/vendelev/sre-metrics/user-login$"
                        - "github.com/vendelev/sre-metrics/user-login/"
                        - "github.com/vendelev/sre-metrics/pkg/"
                    list-mode: lax
                user-login-internal-isolation:
                    files:
                        - "${base-path}/user-login/internal/*.go"
                        - "${base-path}/user-login/internal/**/*.go"
                    deny:
                        - pkg: "github.com/vendelev/sre-metrics/"
                          desc: "внутренние слои user-login могут импортировать только собственные пакеты и явно выделенные общие пакеты pkg."
                    allow:
                        - "$gostd"
                        - "github.com/vendelev/sre-metrics/user-login$"
                        - "github.com/vendelev/sre-metrics/user-login/"
                        - "github.com/vendelev/sre-metrics/pkg/"
                    list-mode: lax
                otlpmetrics-isolation:
                    files:
                        - "${base-path}/pkg/otlpmetrics/*.go"
                        - "${base-path}/pkg/otlpmetrics/**/*.go"
                    deny:
                        - pkg: "github.com/vendelev/sre-metrics/"
                          desc: "otlpmetrics не импортирует функциональные модули; общие технические контракты разрешены только в pkg."
                    allow:
                        - "$gostd"
                        - "github.com/vendelev/sre-metrics/pkg/"
                    list-mode: lax
                domain:
                    files:
                        - "${base-path}/user-login/internal/domain/*.go"
                        - "${base-path}/user-login/internal/domain/**/*.go"
                    list-mode: strict
                    allow:
                        - "$gostd"
                        - "github.com/google/uuid$"
                        - "github.com/vendelev/sre-metrics/user-login/internal/domain$"
                        - "github.com/vendelev/sre-metrics/user-login/internal/domain/"
                    deny:
                        - pkg: "net/http"
                          desc: "HTTP относится к presentation, а не к domain."
                application:
                    files:
                        - "${base-path}/user-login/internal/application/*.go"
                        - "${base-path}/user-login/internal/application/**/*.go"
                    list-mode: strict
                    allow:
                        - "$gostd"
                        - "github.com/google/uuid$"
                        - "github.com/vendelev/sre-metrics/pkg/clock$"
                        - "github.com/vendelev/sre-metrics/user-login/internal/domain$"
                        - "github.com/vendelev/sre-metrics/user-login/internal/domain/"
                        - "github.com/vendelev/sre-metrics/user-login/internal/application$"
                        - "github.com/vendelev/sre-metrics/user-login/internal/application/"
                    deny:
                        - pkg: "net/http"
                          desc: "Код application работает с событиями, а не с HTTP-запросами."
                presentation:
                    files:
                        - "${base-path}/user-login/internal/presentation/*.go"
                        - "${base-path}/user-login/internal/presentation/**/*.go"
                    list-mode: strict
                    allow:
                        - "$gostd"
                        - "github.com/google/uuid$"
                        - "github.com/go-chi/**"
                        - "github.com/vendelev/sre-metrics/pkg/clock$"
                        - "github.com/vendelev/sre-metrics/pkg/fileinbox/api$"
                        - "github.com/vendelev/sre-metrics/user-login/config$"
                        - "github.com/vendelev/sre-metrics/user-login/internal/domain$"
                        - "github.com/vendelev/sre-metrics/user-login/internal/domain/"
                        - "github.com/vendelev/sre-metrics/user-login/internal/application$"
                        - "github.com/vendelev/sre-metrics/user-login/internal/application/"
                        - "github.com/vendelev/sre-metrics/user-login/internal/infrastructure$"
                        - "github.com/vendelev/sre-metrics/user-login/internal/infrastructure/"
                        - "github.com/vendelev/sre-metrics/user-login/internal/presentation$"
                        - "github.com/vendelev/sre-metrics/user-login/internal/presentation/"
                infrastructure-isolation:
                    files:
                        - "${base-path}/user-login/internal/infrastructure/*.go"
                        - "${base-path}/user-login/internal/infrastructure/**/*.go"
                    deny:
                        - pkg: "github.com/vendelev/sre-metrics/user-login/internal/presentation"
                          desc: "Infrastructure не зависит от Presentation; обратное направление разрешено матрицей."
                worker-isolation:
                    files:
                        - "${base-path}/user-login/internal/infrastructure/worker/*.go"
                        - "!${base-path}/user-login/internal/infrastructure/worker/*_test.go"
                    list-mode: strict
                    allow:
                        - "$gostd"
                        - "github.com/google/uuid$"
                        - "github.com/vendelev/sre-metrics/user-login/internal/domain$"
                        - "github.com/vendelev/sre-metrics/user-login/internal/domain/"
                        - "github.com/vendelev/sre-metrics/user-login/internal/application/usecase$"
                        - "github.com/vendelev/sre-metrics/user-login/internal/application/usecase/"
                    deny:
                        - pkg: "github.com/vendelev/sre-metrics/user-login/internal/infrastructure/queue"
                          desc: "worker получает готовый канал и операцию закрытия приёма, а не очередь."
