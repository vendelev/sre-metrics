include:
    - docker-compose.grafana.yml

services:
    user-login-metrics:
        build:
            context: .
            dockerfile: docker/metrics/Dockerfile
        container_name: user-login-metrics
        restart: unless-stopped
        env_file:
            - .env
        stop_grace_period: 15s
        depends_on:
            metrics-otel-collector:
                condition: service_started
        mem_limit: 64m
        cpus: 0.25
        read_only: true
        cap_drop: [ALL]
        security_opt: [no-new-privileges:true]
        labels:
            - "traefik.enable=false"
        logging:
            driver: json-file
            options:
                max-file: "2"
                max-size: 5m
        volumes:
            - user-login-metrics:/mnt/metrics
        networks:
            - all
            - default

    # Используется для тестовой публикации файлов
    user-login-inbox-writer:
        profiles: [file-inbox]
        image: alpine:3.20
        user: "65532:65532"
        command: ["true"]
        read_only: true
        cap_drop: [ALL]
        security_opt: [no-new-privileges:true]
        labels:
            - "traefik.enable=false"
        volumes:
            - user-login-metrics:/mnt/metrics
        networks:
            - all

    metrics-otel-collector:
        image: otel/opentelemetry-collector-contrib:0.165.0
        container_name: metrics-otel-collector
        restart: unless-stopped
        labels:
            - "traefik.enable=false"
        command:
            - --config=/etc/otelcol-contrib/config.yaml
            - --config=/etc/otelcol-contrib/local.yaml
        healthcheck:
            # Проверяет конфигурацию, а не готовность приёмника OTLP.
            test:
                - CMD
                - /otelcol-contrib
                - validate
                - --config=/etc/otelcol-contrib/config.yaml
                - --config=/etc/otelcol-contrib/local.yaml
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 10s
        volumes:
            - ./docker/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
            - ./docker/otel-collector/local.yaml:/etc/otelcol-contrib/local.yaml:ro
        networks:
            - all
            - default

networks:
    all:
        name: sptr_all
        external: true

volumes:
    user-login-metrics:
        driver: local
        driver_opts:
            type: tmpfs
            device: tmpfs
            o: size=268435456,mode=0777
