version: "2"

run:
  relative-path-mode: gomod

linters:
  default: standard
  enable:
    - depguard
  settings:
    depguard:
      rules:
        user-auth-isolation:
          files:
            - "${base-path}/service/user-auth/**/*.go"
          deny:
            - pkg: "metrics/"
              desc: "user-auth может импортировать только собственные пакеты и явно выделенные общие пакеты platform."
          allow:
            - "$gostd"
            - "metrics/service/user-auth$"
            - "metrics/service/user-auth/"
            - "metrics/platform/"
          list-mode: lax
        domain:
          files:
            - "${base-path}/service/user-auth/internal/domain/**/*.go"
          list-mode: strict
          allow:
            - "$gostd"
            - "metrics/service/user-auth/internal/domain$"
            - "metrics/service/user-auth/internal/domain/"
          deny:
            - pkg: "net/http"
              desc: "HTTP относится к presentation, а не к domain."
        application:
          files:
            - "${base-path}/service/user-auth/internal/application/**/*.go"
          list-mode: strict
          allow:
            - "$gostd"
            - "metrics/service/user-auth/internal/domain$"
            - "metrics/service/user-auth/internal/domain/"
            - "metrics/service/user-auth/internal/application$"
            - "metrics/service/user-auth/internal/application/"
          deny:
            - pkg: "net/http"
              desc: "Код application работает с событиями, а не с HTTP-запросами."
